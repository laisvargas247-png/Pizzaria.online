
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Carrinho | Pizzaria Online</title>

    <link rel="stylesheet" href="css/carrinho.css">

</head>


<body>


    <!-- CABEÇALHO -->

    <header>

        <div class="logo">
            🍕 Pizzaria Online
        </div>

        <nav>

            <a href="index.html">
                Início
            </a>

            <a href="cardapio.html">
                Cardápio
            </a>

            <a href="carrinho.html" class="ativo">
                🛒 Carrinho
            </a>

        </nav>

    </header>


    <!-- CONTEÚDO -->

    <main>

        <div class="titulo">

            <h1>
                🛒 Seu pedido
            </h1>

            <p>
                Confira seus produtos antes de finalizar.
            </p>

        </div>


        <div class="layout">


            <!-- PRODUTOS -->

            <section class="lista">

                <div id="carrinho">

                    <!-- JavaScript coloca os produtos aqui -->

                </div>

            </section>


            <!-- RESUMO -->

            <aside class="resumo">

                <h2>
                    Resumo do pedido
                </h2>


                <div class="linha">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        R$ 0,00
                    </strong>

                </div>


                <div class="linha">

                    <span>
                        Entrega
                    </span>

                    <strong id="entrega">
                        R$ 5,00
                    </strong>

                </div>


                <hr>


                <div class="total">

                    <span>
                        Total
                    </span>

                    <strong id="total">
                        R$ 0,00
                    </strong>

                </div>


                <h3>
                    Seus dados
                </h3>


                <input
                    type="text"
                    id="nome"
                    placeholder="Nome completo"
                >


                <input
                    type="tel"
                    id="telefone"
                    placeholder="Telefone"
                >


                <input
                    type="text"
                    id="endereco"
                    placeholder="Endereço para entrega"
                >


                <textarea
                    id="observacao"
                    placeholder="Observação do pedido (opcional)"
                ></textarea>


                <button
                    class="finalizar"
                    onclick="finalizarPedido()"
                >
                    🍕 Fazer pedido
                </button>


                <a
                    href="cardapio.html"
                    class="continuar"
                >
                    ← Continuar comprando
                </a>

            </aside>

        </div>

    </main>


    <script src="js/carrinho.js"></script>

</body>

</html>
